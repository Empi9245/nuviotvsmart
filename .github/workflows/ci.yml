name: NPM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run reproducible core tests
        shell: bash
        run: |
          if [[ -f tests/test-plugin-system.mjs && -f tests/test-plugin-localization.mjs ]]; then
            npm test
          else
            echo "::warning::npm test references plugin test files that are not tracked in this repository or upstream; running the reproducible tracked subset instead."
            npm run build
            node ./scripts/test-webos-plugin-forwarding.cjs
          fi

      - name: Run lint
        run: npm run lint

  vidaa:
    name: VIDAA tests and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package VIDAA
        run: npm run package:vidaa

      - name: Run VIDAA test suites
        run: npm run test:vidaa
